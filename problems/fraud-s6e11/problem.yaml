name: fraud-s6e11
source:
  type: kaggle
  competition: playground-series-s6e11
description: 'Predicting Credit Card Fraud (Kaggle metric: Roc Auc Score)'
target: is_fraud
id_column: id
task: binary
metric: roc_auc
# Deadline 2026-11-30, 10 submissions/day. GPU gradient boosting only; RF and
# linear models rarely win at 700k rows and use most of the time budget.
models: [XGBoost, CatBoost, LightGBM]
budget:
  n_trials: 15
  timeout_per_model: 900
# Leak-safe encodings (features/encoding.py): out-of-fold target encoding and
# count encoding of categoricals, low-cardinality numerics and their pairs
feature_engineering:
  encodings:
    target_encode: auto
    count_encode: auto
    pairs: auto
    numeric_as_categorical: auto
    max_unique: 50
    max_pairs: 28
# Blend the run's models with a logistic stacker on out-of-fold log-odds
ensemble:
  method: stack
  top: 10
