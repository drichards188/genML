[project]
name = "genML"
version = "0.1.0"
description = "Declarative tabular ML pipeline for Kaggle-style problems"
authors = [{ name = "David Richards", email = "50757879+drichards188@users.noreply.github.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "pandas>=2.0.0,<3.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0.0",
    "optuna>=3.0.0",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "watchdog>=3.0.0",
    "psutil>=5.9.0",
]
kaggle = [
    "kagglehub>=0.3.0",
]

[project.scripts]
kickoff = "genML.main:kickoff"
run_pipeline = "genML.main:kickoff"
plot = "genML.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genML"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end runs on real problem data (deselect with -m 'not slow')",
]
